[project]
name = "fsaie"
version = "0.1.0"
description = "My working repo for the Towards AI Full Stack AI Engineering course."
readme = "README.md"
authors = [
    { name = "sbdatasc", email = "saurav.bakshi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.110.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[project.scripts]
fsaie = "fsaie:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
